apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
data:
  config.yaml: |
    port: 7880

    rtc:
      tcp_port: 7882
      use_external_ip: true
      turn_servers:
        - host: turn.goblin-ti.me
          port: 3478
          protocol: udp
          credential: $(LIVEKIT_TURN_SECRET)

    logging:
      level: info
      json: true
