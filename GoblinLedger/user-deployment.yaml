apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: ledger-manager
          image: xpenguingodx/userservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: goblin-secrets
                  key: db-url
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: 8088
