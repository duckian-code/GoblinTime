# kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
      - containerPort: 443
        hostPort: 443
      - containerPort: 3478
        hostPort: 3478
        protocol: UDP
      - containerPort: 3478
        hostPort: 3478
        protocol: TCP
      - containerPort: 5349
        hostPort: 5349
        protocol: TCP
