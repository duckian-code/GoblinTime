# coturn-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true
      containers:
        - name: coturn
          image: coturn/coturn:latest
          args:
            - -c
            - /etc/coturn/turnserver.conf
          env:
            - name: COTURN_TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: coturn-secrets
                  key: turn_secret
          volumeMounts:
            - name: coturn-config
              mountPath: /etc/coturn
      volumes: 
        - name: coturn-config
          configMap:
            name: coturn-config
---
apiVersion: v1
kind: Service
metadata:
  name: coturn
spec:
  selector:
    app: coturn
  type: LoadBalancer
  ports:
    - name: turn-udp
      port: 3478
      protocol: UDP
    - name: turn-tcp
      port: 3478
      protocol: TCP
    - name: turn-tls
      port: 5349
      protocol: TCP
