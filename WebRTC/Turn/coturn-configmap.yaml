# coturn-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349

    external-ip=5.78.204.177

    use-auth-secret
    static-auth-secret=$(COTURN_TURN_SECRET)

    realm=goblin-ti.me

    log-file=stdout
    verbose

    min-port=49152
    max-port=65535
