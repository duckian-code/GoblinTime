# DEMO/LOCAL DEVELOPENT DOCKER COMPOSE
services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: penguin
      POSTGRES_DB: GoblinTime
    ports:
      - "5432:5432"
    volumes:
      - goblin_pg_data:/var/lib/postgresql/data

  GoblinLedger:
    image: goblinledger
    build:
      context: ./GoblinLedger
    container_name: GoblinLedger
    environment:
      DB_URL: host=postgres user=admin password=penguin dbname=GoblinTime port=5432 sslmode=disable
    ports:
      - "8088:8088"
    depends_on:
      - postgres
   # profiles:
    #  - user

  goblin-security:
    #image: goblinsecurity
    build:
      context: ./GoblinAuth/GoblinSecurity
    container_name: goblin-security
    ports:
      - "8089:8089"
    environment:
      USER_SERVICE_URL: http://GoblinLedger:8088
      DB_URL: host=postgres user=admin password=penguin dbname=GoblinTime port=5432 sslmode=disable
      JWT_SECRET: fe120c6ea821e63927344f13ab90b88423bb6f77c683811de1d9d2bedbbf2a7
    depends_on:
      - GoblinLedger
   # profiles:
    #  - auth

  GoblinTimeSignaling:
    image: goblintimesignaling
    build:
      context: ./GoblinTimeSignaling
    container_name: GoblinTimeSignaling
    ports:
      - "8083:8083"
    environment:
      USER_SERVICE_URL: http://GoblinLedger:8088
    depends_on:
      - GoblinLedger
  #  profiles:
   #   - signaling

  GoblinTime:
    image: goblintime
    build:
      context: ./GoblinTime
    container_name: GoblinTime
    ports:
      - "3000:80"
    environment:
      VITE_USER_SERVICE_URL: http://localhost:8088
      VITE_AUTH_SERVICE_URL: http://localhost:8089
      VITE_LIVEKIT_URL: ws://localhost:7880 # will not work - don't sweat it rn

      VITE_USER_ENDPOINT: /user/profile
      VITE_CONTACTS_ENDPOINT: /user/contacts
      VITE_FRIEND_ENDPOINT: /user/contacts/recommendations

      VITE_REGISTER_ENDPOINT: /user/register
      VITE_LOGIN_ENDPOINT: /users/login

    depends_on:
      - GoblinLedger
      - goblin-security
      - GoblinTimeSignaling
 #   profiles:
  #    - frontend

volumes:
  goblin_pg_data:
