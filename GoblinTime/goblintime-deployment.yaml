# k8s-deployment.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: goblintime-frontend-config
  namespace: default
data:
  # These can be overridden per environment via kubectl or Kustomize
  VITE_WS_URL: "wss://goblintime-api.example.com"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goblintime-frontend
  namespace: default
  labels:
    app: goblintime-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: goblintime-frontend
  template:
    metadata:
      labels:
        app: goblintime-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/goblintime-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          envFrom:
            # Map ConfigMap keys to environment variables
            - configMapRef:
                name: goblintime-frontend-config
          # Liveness probe — is the container alive?
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness probe — is the container ready to serve traffic?
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: goblintime-frontend
  namespace: default
  labels:
    app: goblintime-frontend
spec:
  type: ClusterIP
  selector:
    app: goblintime-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP