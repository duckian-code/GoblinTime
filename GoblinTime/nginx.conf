server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint for Kubernetes probes
    location /health {
        access_log off;
        default_type text/plain;
        return 200 'healthy\n';

    }

    location / {
        try_files $uri /index.html;
    }
}